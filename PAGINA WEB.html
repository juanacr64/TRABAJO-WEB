<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabajo Número 1 - Desarrollo Web</title>
  <style>
    /* 1. VARIABLES CSS (:root) */
    :root {
      --bg-dark: #001f24;
      --bg-active: #ffffff;
      --text-dark: #001f24;
      --text-light: #ffffff;
      --accent-color: #00bcd4;
      --font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* MENÚ DE NAVEGACIÓN */
    nav {
      width: 100%;
      max-width: 900px;
      background-color: var(--bg-dark);
      margin-top: 20px;
    }

    nav ul {
      display: flex;
      list-style: none;
    }

    nav li {
      flex: 1;
    }

    nav a {
      display: block;
      text-align: center;
      padding: 12px 0;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      transition: background-color 0.3s, color 0.3s;
    }

    /* PSEUDO-CLASES CSS */
    /* Pestaña activa (primera opción por defecto) */
    nav li:first-child a {
      background-color: var(--bg-active);
      color: var(--text-dark);
    }

    /* Resto de pestañas no activas */
    nav li:not(:first-child) a {
      color: var(--text-light);
    }

    /* Efecto al pasar el cursor (hover) */
    nav li:not(:first-child) a:hover {
      background-color: rgba(255, 255, 255, 0.15);
      color: var(--accent-color);
    }

    /* Efecto al hacer clic (active) */
    nav a:active {
      opacity: 0.8;
    }

    /* CONTENEDOR CENTRAL DE LA IMAGEN */
    main {
      width: 100%;
      max-width: 900px;
      background-color: #ffffff;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    main img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* PIE DE PÁGINA (FOOTER) */
    footer {
      width: 100%;
      max-width: 900px;
      background-color: var(--bg-dark);
      color: var(--text-light);
      padding: 15px 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- MENÚ -->
  <nav>
    <ul>
      <li><a href="#">Inicio</a></li>
      <li><a href="#">Productos</a></li>
      <li><a href="#">Servicios</a></li>
      <li><a href="#">Acerca de</a></li>
      <li><a href="#">Contáctanos</a></li>
    </ul>
  </nav>

  <!-- CONTENIDO CENTRAL CON IMAGEN -->
  <main>
    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhATERsDyPKqNvHHQnFSOcmjHumb0tfC-WZi0oOzfcx22VQ_Xm1Bz7kyFHa6g2byB97B2GLUF3T4evkc2xtVcQJHWxuCLSqhKcB7fHUq3obDdqLEeyKm21WJTL8jtkFIOmzvSjsxw/s1600/paisajes+naturales+-+naturaleza+-+natural+free+landscapes+-+fotos+de+paisajes+(2).jpg alt="Desarrollo Web e HTML5">
  </main>

  <!-- PIE DE PÁGINA -->
  <footer>
    <p>Elaborado por Juana Jamileth Cruz Aguirre</p>
  </footer>

</body>
</html>
