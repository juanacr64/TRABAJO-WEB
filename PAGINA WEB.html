<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo Número 2 - Desarrollo Web Responsive</title>
    <style>
        /* 1. VARIABLES CSS (:root) */
        :root {
            --bg-oscuro: #001f24;
            --bg-activo: #ffffff;
            --texto-oscuro: #001f24;
            --luz-texto: #ffffff;
            --color-acento: #00bcd4;
            --familia-fuentes: Arial, Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--familia-fuentes);
            background-color: var(--bg-oscuro);
            color: var(--luz-texto);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* NAVEGACIÓN Y PSEUDO-CLASES */
        nav {
            background-color: var(--bg-oscuro);
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }

        ul.menu {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
        }

        ul.menu li a {
            display: block;
            padding: 12px 24px;
            color: var(--luz-texto);
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        /* Pseudo-clase :first-child para destacar 'Inicio' */
        ul.menu li:first-child a {
            background-color: #e2e2cb;
            color: var(--texto-oscuro);
        }

        /* Pseudo-clases :hover y :not() */
        ul.menu li:not(:first-child) a:hover {
            background-color: var(--color-acento);
            color: var(--texto-oscuro);
        }

        /* CONTENIDO PRINCIPAL */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .contenedor-imagen {
            max-width: 800px;
            width: 100%;
            margin-top: 20px;
        }

        .contenedor-imagen img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* 2. REESTRUCTURACIÓN RESPONSIVE CON MEDIA QUERIES */
        @media (max-width: 768px) {
            ul.menu {
                flex-direction: column;
                width: 100%;
                padding: 0 20px;
            }

            ul.menu li {
                width: 100%;
                text-align: center;
            }

            ul.menu li a {
                padding: 15px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }

            main {
                padding: 10px;
            }
        }

        /* 3. PIE DE PÁGINA */
        footer {
            background-color: rgba(0, 0, 0, 0.3);
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul class="menu">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Productos</a></li>
                <li><a href="#">Servicios</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Diseño Adaptativo / Responsive</h1>
        <div class="contenedor-imagen">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Imagen de fondo">
        </div>
    </main>

    <footer>
        <p>Elaborado por: <strong>Juana Jamileth Cruz Aguirre</strong></p>
    </footer>

</body>
</html>
